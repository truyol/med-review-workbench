[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medreview-api"
version = "0.1.0"
description = "API for the Med Review Workbench"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pydantic-settings>=2.6,<3",
  "pydicom>=3,<4",
  "pylibjpeg>=2,<3",
  "pylibjpeg-libjpeg>=2,<3",
  "pylibjpeg-openjpeg>=2,<3",
  "pylibjpeg-rle>=2,<3",
  "pyjpegls>=1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2,<3",
  "structlog>=24,<27",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4"
]
dev = [
  "mypy>=1.13,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
